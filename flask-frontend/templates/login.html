<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Iniciar sesión - Sistema Bancario Distribuido</title>

    <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/font.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- CSS profesional externo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "var(--color-tertiary-container)",
                        "outline": "var(--color-outline)",
                        "on-primary-container": "var(--color-on-primary-container)",
                        "on-secondary": "var(--color-on-secondary)",
                        "on-tertiary-fixed": "var(--color-on-tertiary-fixed)",
                        "on-primary-fixed": "var(--color-on-primary-fixed)",
                        "surface-bright": "var(--color-surface-bright)",
                        "surface": "var(--color-surface)",
                        "secondary-fixed-dim": "var(--color-secondary-fixed-dim)",
                        "surface-dim": "var(--color-surface-dim)",
                        "surface-container-low": "var(--color-surface-container-low)",
                        "background": "var(--color-background)",
                        "tertiary-fixed": "var(--color-tertiary-fixed)",
                        "on-error": "var(--color-on-error)",
                        "on-surface": "var(--color-on-surface)",
                        "tertiary-fixed-dim": "var(--color-tertiary-fixed-dim)",
                        "surface-container": "var(--color-surface-container)",
                        "secondary-fixed": "var(--color-secondary-fixed)",
                        "error-container": "var(--color-error-container)",
                        "primary-fixed-dim": "var(--color-primary-fixed-dim)",
                        "inverse-surface": "var(--color-inverse-surface)",
                        "surface-container-high": "var(--color-surface-container-high)",
                        "on-error-container": "var(--color-on-error-container)",
                        "inverse-on-surface": "var(--color-inverse-on-surface)",
                        "primary-fixed": "var(--color-primary-fixed)",
                        "on-tertiary": "var(--color-on-tertiary)",
                        "surface-variant": "var(--color-surface-variant)",
                        "on-secondary-fixed": "var(--color-on-secondary-fixed)",
                        "on-primary-fixed-variant": "var(--color-on-primary-fixed-variant)",
                        "on-primary": "var(--color-on-primary)",
                        "secondary-container": "var(--color-secondary-container)",
                        "on-tertiary-container": "var(--color-on-tertiary-container)",
                        "on-secondary-fixed-variant": "var(--color-on-secondary-fixed-variant)",
                        "inverse-primary": "var(--color-inverse-primary)",
                        "on-secondary-container": "var(--color-on-secondary-container)",
                        "secondary": "var(--color-secondary)",
                        "surface-container-lowest": "var(--color-surface-container-lowest)",
                        "primary-container": "var(--color-primary-container)",
                        "error": "var(--color-error)",
                        "on-tertiary-fixed-variant": "var(--color-on-tertiary-fixed-variant)",
                        "tertiary": "var(--color-tertiary)",
                        "surface-container-highest": "var(--color-surface-container-highest)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        "primary": "var(--color-primary)",
                        "outline-variant": "var(--color-outline-variant)",
                        "on-background": "var(--color-on-background)",
                        "surface-tint": "var(--color-surface-tint)"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Geist", "sans-serif"],
                        "display": ["Geist", "sans-serif"],
                        "body": ["Geist", "sans-serif"],
                        "label": ["Geist", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col justify-center items-center p-4 md:p-8 text-on-background">

<!-- Toggle de tema -->
<div class="absolute top-4 right-4 flex items-center gap-2">
    <span class="material-symbols-outlined text-on-surface-variant text-[20px]">light_mode</span>
    <button id="themeToggle" class="w-12 h-6 rounded-full bg-surface-container-high border border-outline-variant relative transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-primary" onclick="toggleTheme()">
        <span id="themeToggleDot" class="absolute left-1 top-1 w-4 h-4 rounded-full bg-primary transition-transform duration-300"></span>
    </button>
    <span class="material-symbols-outlined text-on-surface-variant text-[20px]">dark_mode</span>
</div>

<main class="w-full max-w-md">
    <div class="bg-surface-container border border-outline-variant rounded-2xl shadow-sm p-8 flex flex-col gap-6">
        <div class="flex flex-col items-center text-center gap-3">
            <div class="w-12 h-12 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container mb-2">
                <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
            </div>
            <h1 class="font-headline text-2xl font-semibold text-on-surface tracking-tight">Sistema Bancario Distribuido</h1>
            <p class="font-body text-sm text-on-surface-variant">Acceso institucional seguro</p>
        </div>

        {% if error %}
        <div class="bg-error-container/20 text-on-error-container px-4 py-3 rounded-lg font-body text-sm border border-error/30">
            {{ error }}
        </div>
        {% endif %}

        <form class="flex flex-col gap-4" method="POST" action="{{ url_for('do_login') }}">
            <div class="flex flex-col gap-1">
                <label class="font-label text-sm text-on-surface" for="username">Usuario</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
                    <input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline rounded-lg font-body text-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                           id="username" name="username" placeholder="Ingresa tu usuario" required type="text"/>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <div class="flex justify-between items-center">
                    <label class="font-label text-sm text-on-surface" for="password">Contraseña</label>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
                    <input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline rounded-lg font-body text-base text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                           id="password" name="password" placeholder="••••••••" required type="password"/>
                </div>
            </div>

            <div class="flex items-center justify-between mt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary bg-surface-container-lowest" type="checkbox" name="remember" value="1"/>
                    <span class="font-body text-sm text-on-surface-variant">Recordarme</span>
                </label>
                <a class="font-label text-sm text-primary hover:text-primary/80 transition-colors" href="#">Recuperar acceso</a>
            </div>

            <button class="mt-4 w-full py-3 bg-primary hover:bg-primary/90 text-on-primary font-label text-sm rounded-lg transition-colors flex justify-center items-center gap-2" type="submit">
                Ingresar
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>
    </div>

    <div class="mt-6 text-center font-body text-sm text-on-surface-variant">
        <p>© {{ current_year | default('2024') }} Sistemas de nodos institucionales. Todos los derechos reservados.</p>
    </div>
</main>

<script>
    (function() {
        const savedTheme = localStorage.getItem('theme');
        const html = document.documentElement;
        if (savedTheme === 'light') {
            html.classList.remove('dark');
        } else {
            html.classList.add('dark');
        }
        updateToggleDot();
    })();

    function toggleTheme() {
        const html = document.documentElement;
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        } else {
            html.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        }
        updateToggleDot();
    }

    function updateToggleDot() {
        const dot = document.getElementById('themeToggleDot');
        if (!dot) return;
        if (document.documentElement.classList.contains('dark')) {
            dot.style.transform = 'translateX(24px)';
        } else {
            dot.style.transform = 'translateX(0)';
        }
    }

    document.addEventListener('DOMContentLoaded', updateToggleDot);
</script>
</body>
</html>
