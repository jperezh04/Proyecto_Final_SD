syntax = "proto3";

package bank;

service BankService {
    rpc GetBalance (BalanceRequest) returns (BalanceResponse);
    rpc ListAccounts (AccountsRequest) returns (AccountsResponse);
    rpc GetTransactions (TransactionsRequest) returns (TransactionsResponse);
    rpc Deposit (TransactionRequest) returns (TransactionResponse);
    rpc Withdraw (TransactionRequest) returns (TransactionResponse);
    rpc TransferLocal (TransferRequest) returns (TransferResponse);
    rpc Prepare (PrepareRequest) returns (PrepareResponse);
    rpc Commit (CommitRequest) returns (CommitResponse);
    rpc Abort (AbortRequest) returns (AbortResponse);
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
    rpc Election (ElectionRequest) returns (ElectionResponse);
    rpc Coordinator (CoordinatorRequest) returns (CoordinatorResponse);
    rpc GetEvents (EventsRequest) returns (EventsResponse);
    rpc SetNodeStatus (NodeStatusRequest) returns (NodeStatusResponse);
}

message BalanceRequest { string account_id = 1; }
message BalanceResponse { string account_id = 1; double balance = 2; string currency = 3; }

message Account {
    string account_id = 1;
    string owner = 2;
    double balance = 3;
    string currency = 4;
    string type = 5;
    string created_at = 6;
    string updated_at = 7;
}
message AccountsRequest { string owner = 1; }
message AccountsResponse { repeated Account accounts = 1; }

message TransactionRecord {
    string transaction_id = 1;
    string timestamp = 2;
    string type = 3;
    string source_account = 4;
    string dest_account = 5;
    double amount = 6;
    string currency = 7;
    string description = 8;
    string status = 9;
    string bank_id = 10;
}
message TransactionsRequest { string account_id = 1; }
message TransactionsResponse { repeated TransactionRecord transactions = 1; }

message TransactionRequest { string account_id = 1; double amount = 2; }
message TransactionResponse { bool success = 1; string message = 2; double new_balance = 3; }

message TransferRequest { string source_account = 1; string dest_account = 2; double amount = 3; string description = 4; }
message TransferResponse { bool success = 1; string message = 2; string transaction_id = 3; }

message PrepareRequest { string transaction_id = 1; string account_id = 2; double amount = 3; string operation_type = 4; }
message PrepareResponse { string transaction_id = 1; bool vote = 2; }

message CommitRequest { string transaction_id = 1; }
message CommitResponse { bool success = 1; }

message AbortRequest { string transaction_id = 1; }
message AbortResponse { bool success = 1; }

message HeartbeatRequest { string node_id = 1; }
message HeartbeatResponse { bool alive = 1; string leader_id = 2; }

message ElectionRequest { string candidate_id = 1; }
message ElectionResponse { bool acknowledged = 1; }

message CoordinatorRequest { string leader_id = 1; }
message CoordinatorResponse { bool accepted = 1; }

message EventsRequest {}
message Event {
    string timestamp = 1;
    string type = 2;
    string title = 3;
    string description = 4;
}
message EventsResponse { repeated Event events = 1; }

message NodeStatusRequest { bool paused = 1; }
message NodeStatusResponse { bool success = 1; string message = 2; }
